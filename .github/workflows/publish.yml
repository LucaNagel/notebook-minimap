# Publishes to the VS Code Marketplace when a version tag is pushed:
#   git tag v0.4.1 && git push origin v0.4.1
# Authentication uses Marketplace Trusted Publishing (no token stored here):
# the publisher "mriluca" needs a Trusted Publishing policy for
# LucaNagel / notebook-minimap / publish.yml.
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --oidc --no-dependencies
